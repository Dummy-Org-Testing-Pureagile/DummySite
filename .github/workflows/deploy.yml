name: Deploy to test host

# Merging a pull request to main updates the live site. That is the point of this repository: the
# PR Agent opens a PR, a human approves it, and the result is visible at the instance IP.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second deploy while one is mid-build would leave the checkout half-updated.
  group: deploy-test-host
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build here as well as on the host: a broken build should fail the workflow rather than take
      # the site down when the host restarts the service.
      - run: npm run build

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Deploys run through SSM rather than SSH, so the instance exposes port 80 and nothing else -
      # no key material in GitHub, no inbound 22, no bastion.
      - name: Deploy via SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7} by ${GITHUB_ACTOR}" \
            --parameters commands='["/usr/local/bin/dummysite-deploy"]' \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"

          for _ in $(seq 1 40); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                # Surface the host's own error, or the failure is a status word with no cause.
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text

      - name: Verify the site is serving
        run: |
          # A green deploy that leaves the site down is not a green deploy.
          for _ in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${{ vars.DEPLOY_HOST }}/" || echo 000)
            echo "http $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "Site did not return 200 after deploying."
          exit 1
